<!doctype html>
<title>Rental Price Hedonics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: full-screen slide deck, one <section> visible at a time, JS-driven index */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#5a5a5a; --rule:#cfcfcf; --tbl-head:#f2f2f2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --fg:#ededed; --muted:#a3a3a3; --rule:#3a3a3a; --tbl-head:#1c1c1c;

  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --fg:#ededed; --muted:#a3a3a3; --rule:#3a3a3a; --tbl-head:#1c1c1c;

}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  overflow:hidden;
}
.deck{ position:relative; height:100%; width:100%; max-width:980px; margin:0 auto; }
.slide{
  position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
  padding:48px 8px 76px; overflow-y:auto;
}
.slide.active{ display:flex; }
.slide h1{ font-size:clamp(22px,4vw,34px); font-weight:600; margin:0 0 6px; text-wrap:balance; letter-spacing:-0.01em; }
.slide h2{ font-size:clamp(17px,2.6vw,21px); font-weight:600; margin:28px 0 10px; }
.kicker{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 14px; }
.rule{ border:0; border-top:1px solid var(--rule); margin:14px 0 22px; }
p{ line-height:1.55; font-size:15px; max-width:66ch; }
.lede{ font-size:17px; color:var(--muted); max-width:62ch; line-height:1.5; }
ul{ margin:8px 0; padding-left:20px; }
li{ line-height:1.6; font-size:15px; margin-bottom:6px; }
.muted{ color:var(--muted); }
.small{ font-size:12.5px; color:var(--muted); }
.eq{ margin:18px 0; font-size:16px; overflow-x:auto; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
@media (max-width:640px){ .grid2{ grid-template-columns:1fr; } }
.bigstat{ display:flex; gap:28px; flex-wrap:wrap; margin:10px 0 4px; }
.bigstat div{ min-width:120px; }
.bigstat .n{ font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
.bigstat .l{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }
table{ border-collapse:collapse; width:100%; font-size:13.5px; font-variant-numeric:tabular-nums; }
th,td{ padding:6px 10px; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap; }
th:first-child,td:first-child{ text-align:left; white-space:normal; }
thead th{ background:var(--tbl-head); font-weight:600; border-bottom:1px solid var(--rule); }
.tblwrap{ overflow-x:auto; max-width:100%; margin:10px 0; }
.sig{ font-weight:600; }
.note{ font-size:12px; color:var(--muted); margin-top:10px; }
.figwrap{ display:flex; justify-content:center; margin:10px 0; }
.figwrap img{ max-width:100%; max-height:62vh; height:auto; }
.cap{ font-size:13px; color:var(--muted); text-align:center; margin-top:8px; }
.nav{
  position:fixed; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:12px max(16px, env(safe-area-inset-left,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-right,0px));
  border-top:1px solid var(--rule); background:var(--bg);
  max-width:980px; margin:0 auto; left:50%; transform:translateX(-50%); width:100%;
}
.navbtns{ display:flex; gap:8px; }
button.step{
  font:inherit; font-size:14px; background:none; border:1px solid var(--rule); color:var(--fg);
  border-radius:4px; padding:6px 14px; cursor:pointer;
}
button.step:hover{ background:var(--tbl-head); }
button.step:focus-visible{ outline:2px solid var(--fg); outline-offset:2px; }
button.step:disabled{ opacity:.35; cursor:default; }
.pageno{ font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.MathJax{ font-size:102% !important; }
</style>

<section class="slide">

  <h1>Rent as a bundle of characteristics</h1>
  <p>A rental unit is a bundle of attributes &mdash; size, rooms, floor, age, heating, location &mdash; that the market prices as a whole. Hedonic regression recovers an implicit price for each attribute by regressing the observed rent on the bundle.</p>
  <h2>What this is, and is not</h2>
  <ul>
    <li>This is a <b>cross-sectional, observational</b> dataset: one scrape, one point in time, no randomisation and no repeated observations per unit.</li>
    <li>The results below are <b>descriptive correlations</b>, not causal effects. On the ladder of research designs, this sits near the bottom rung.</li>
    <li>The question we can answer: which characteristics move with rent, and by how much, after holding the others fixed.</li>

<section class="slide">

  <h1>Model</h1>
  <p>Rent is regressed in logs, so each coefficient reads as an approximate percentage effect:</p>
  <div class="eq">$$\\ln(\\text{Price}_i) = \\beta_0 + \\beta_1\\,\\text{Area}_i + \\beta_2\\,\\text{Rooms}_i + \\beta_3\\,\\text{Age}_i + \\beta_4\\,\\text{FloorRatio}_i + \\sum_k \\gamma_k\\,\\text{Heating}_{ik} + \\sum_j \\delta_j\\,\\text{City}_{ij} + \\varepsilon_i$$</div>

    <li>$\\text{FloorRatio}_i = \\dfrac{\\text{Floor}_i}{\\text{TotalFloors}_i}$ &mdash; relative height in the building</li>
    <li>$\\text{Heating}_{ik}$, $\\text{City}_{ij}$ &mdash; dummy variables; reference categories: Centrinis (heating), Kaunas (city)</li>
  </ul>
  <p class="note">Estimated by OLS with HC1 heteroskedasticity-robust standard errors (justified on the diagnostics slide).</p>
</section>

<section class="slide">
  <p class="kicker">9 &middot; Limitations and takeaways</p>
  <h1>What this is worth, and what it is not</h1>
  <h2>Takeaways</h2>
  <ul>
    <li>Size, room count, age, heating and &mdash; especially &mdash; location jointly explain 64% of rent variation (76% within Vilnius with districts).</li>
    <li>Location alone adds more explanatory power than age, floor and heating combined &mdash; and most of the raw city gap survives after controlling for unit size and age.</li>
    <li>An extra room is worth about &euro;105/month at the sample mean &mdash; more than the floor-area line alone predicts: layout is priced on top of size.</li>
    <li>Discounting behaviour is close to unpredictable from listing characteristics, except for floor position.</li>
  </ul>
  <h2>Limitations</h2>
  <ul>
    <li><b>Not causal.</b> No variation is experimentally or quasi-experimentally assigned; coefficients are conditional correlations.</li>
    <li><b>Omitted variables.</b> Renovation quality, exact micro-location, furnishing and photos are all priced by the market and unobserved here.</li>
    <li><b>Single snapshot.</b> One scrape of currently-live ads; no panel structure, so time-on-market and seller fixed effects are out of reach.</li>
  </ul>
</section>

];

const deck = document.getElementById('deck');
slides.forEach((html, i) => { deck.insertAdjacentHTML('beforeend', html); deck.children[i].classList.toggle('active', i===0); });
document.getElementById('tot').textContent = slides.length;

let idx = 0;
const secs = Array.from(deck.children);
function show(i){
  idx = Math.max(0, Math.min(slides.length-1, i));
  secs.forEach((s,j)=>s.classList.toggle('active', j===idx));
  document.getElementById('cur').textContent = idx+1;
  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===slides.length-1;
  try{ localStorage.setItem('rentdeck-idx', String(idx)); }catch(e){}
}
document.getElementById('prev').addEventListener('click', ()=>show(idx-1));
document.getElementById('next').addEventListener('click', ()=>show(idx+1));
window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){ show(idx+1); e.preventDefault(); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ show(idx-1); e.preventDefault(); }
  if(e.key==='Home') show(0);
  if(e.key==='End') show(slides.length-1);
});
let startX=null;
window.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
window.addEventListener('touchend', e=>{
  if(startX===null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if(Math.abs(dx) > 50) show(dx<0 ? idx+1 : idx-1);
  startX = null;
}, {passive:true});

let restored = 0;
try{ restored = parseInt(localStorage.getItem('rentdeck-idx')||'0',10) || 0; }catch(e){}
show(restored);
</script>
